        </div>
    </div>

    <div id="iosPasswordModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeIosPasswordModal()">&times;</span>
            <h2 class="modal-header">IOS PASSWORD</h2>
            <input type="password" id="iosPasswordInput" class="modal-input" placeholder="PASSWORD..." onkeypress="handleIosKeyPress(event)">
            <button class="modal-button" onclick="checkIosPassword()">ENTER</button>
            <p id="iosErrorMessage" class="error-message">
                ❌ ERROR
            </p>
            <p class="password-hint">SOLO EXCELSIOR</p>
        </div>
    </div>

    <div id="pcPasswordModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closePcPasswordModal()">&times;</span>
            <h2 class="modal-header">ESIGN PASSWORD</h2>
            <input type="password" id="pcPasswordInput" class="modal-input" placeholder="PASSWORD..." onkeypress="handlePcKeyPress(event)">
            <button class="modal-button" onclick="checkPcPassword()">ENTER</button>
            <p id="pcErrorMessage" class="error-message">
                ❌ ERROR
            </p>
            <p class="password-hint">SOLO EXCELSIOR</p>
        </div>
    </div>

    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();

        function showPage(pageId) {
            document.querySelectorAll('.section').forEach(section => {
                section.classList.add('hidden');
            });
            document.getElementById(pageId).classList.remove('hidden');
        }

        function goBack() {
            showPage('page1');
        }

        function showIosPasswordModal() {
            document.getElementById('iosPasswordModal').style.display = 'flex';
            document.getElementById('iosPasswordInput').focus();
        }

        function closeIosPasswordModal() {
            document.getElementById('iosPasswordModal').style.display = 'none';
            document.getElementById('iosPasswordInput').value = '';
            document.getElementById('iosErrorMessage').style.display = 'none';
        }

        function handleIosKeyPress(event) {
            if (event.key === 'Enter') {
                checkIosPassword();
            }
        }

        function checkIosPassword() {
            const password = document.getElementById('iosPasswordInput').value;
            if (password === 'blakzet') {
                showPage('page2');
                closeIosPasswordModal();
            } else {
                document.getElementById('iosErrorMessage').style.display = 'block';
            }
        }

        function showPcPasswordModal() {
            document.getElementById('pcPasswordModal').style.display = 'flex';
            document.getElementById('pcPasswordInput').focus();
        }

        function closePcPasswordModal() {
            document.getElementById('pcPasswordModal').style.display = 'none';
            document.getElementById('pcPasswordInput').value = '';
            document.getElementById('pcErrorMessage').style.display = 'none';
        }

        function handlePcKeyPress(event) {
            if (event.key === 'Enter') {
                checkPcPassword();
            }
        }

        function checkPcPassword() {
            const password = document.getElementById('pcPasswordInput').value;
            if (password === 'blakzet') {
                showPage('page4');
                closePcPasswordModal();
            } else {
                document.getElementById('pcErrorMessage').style.display = 'block';
            }
        }

        // دالة للكشف عن محتوى iOS للزر الأول
        function revealIosContent() {
            const iosImage = document.getElementById('iosImage');
            const iosExtraContent = document.getElementById('iosExtraContent');
            const revealButton = document.querySelector('.ios-reveal-button');
            
            iosImage.style.display = 'block';
            iosExtraContent.style.display = 'block';
            
            revealButton.innerHTML = '<i class="fa-solid fa-eye-slash"></i> HIDE PANEL V2';
            revealButton.onclick = hideIosContent;
            
            iosImage.style.animation = 'fadeIn 0.5s ease-in-out';
            iosExtraContent.style.animation = 'fadeIn 0.5s ease-in-out 0.2s';
        }

        function hideIosContent() {
            const iosImage = document.getElementById('iosImage');
            const iosExtraContent = document.getElementById('iosExtraContent');
            const revealButton = document.querySelector('.ios-reveal-button');
            
            iosImage.style.display = 'none';
            iosExtraContent.style.display = 'none';
            
            revealButton.innerHTML = '<i class="fa-solid fa-eye"></i> PANEL V2';
            revealButton.onclick = revealIosContent;
        }

        function revealIosContent2() {
            const iosImage2 = document.getElementById('iosImage2');
            const iosExtraContent2 = document.getElementById('iosExtraContent2');
            const revealButton2 = document.querySelector('.ios-reveal-button-2');
            
            iosImage2.style.display = 'block';
            iosExtraContent2.style.display = 'block';
            
            revealButton2.innerHTML = '<i class="fa-solid fa-eye-slash"></i> HIDE PANEL V3';
            revealButton2.onclick = hideIosContent2;
            
            iosImage2.style.animation = 'fadeIn 0.5s ease-in-out';
            iosExtraContent2.style.animation = 'fadeIn 0.5s ease-in-out 0.2s';
        }

        function hideIosContent2() {
            const iosImage2 = document.getElementById('iosImage2');
            const iosExtraContent2 = document.getElementById('iosExtraContent2');
            const revealButton2 = document.querySelector('.ios-reveal-button-2');
            
            iosImage2.style.display = 'none';
            iosExtraContent2.style.display = 'none';
            
            revealButton2.innerHTML = '<i class="fa-solid fa-eye"></i> PANEL V3';
            revealButton2.onclick = revealIosContent2;
        }

        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(style);

        window.onclick = function(event) {
            const modals = document.querySelectorAll('.modal');
            modals.forEach(modal => {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            });
        };
    </script>
</body>
</html>
